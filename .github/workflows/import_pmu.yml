name: Import PMU programme

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Optional PMU date in DDMMYYYY format"
        required: false
        type: string
  # MODE ÉCONOMIE (depuis le 17/11/2026) : un seul import par jour, le soir.
  # Il couvre la veille, le jour même et le lendemain (defaultDates) ; l'import
  # du matin (04:30 UTC) a été retiré pour réduire les minutes d'Actions.
  schedule:
    - cron: "30 17 * * *"

# Le job n'écrit rien dans le dépôt : lecture seule suffit.
permissions:
  contents: read

# Même groupe que compact_storage.yml : la compaction fait un VACUUM FULL et
# retire temporairement un index, l'import ne doit jamais tourner en même temps.
# Pas de cancel-in-progress : un import en cours va jusqu'au bout.
concurrency:
  group: pmu-database

jobs:
  import-pmu:
    runs-on: ubuntu-latest
    # Le job dure normalement 21-31 min (import 13-19 min + apprentissage 8-11 min).
    # L'ancienne limite de 30 min tuait l'étape "Learn from official results" environ
    # une exécution sur deux. Marge portée à 120 min (programme point de vente, toutes nations) ; les garde-fous anti-blocage
    # réels sont désormais posés par étape ci-dessous.
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # L'entrée passe par l'environnement, jamais interpolée dans `run:` :
      # `${{ inputs.date }}` dans un script shell est une injection de commande.
      PMU_DATE: ${{ inputs.date }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci
        # Les secrets de la base ne sont pas exposés aux scripts d'installation
        # des quelque 500 dépendances : une seule compromise suffirait sinon à
        # exfiltrer l'accès complet à la base.
        env:
          DATABASE_URL: ""

      - name: Apply database schema
        run: npm run db:schema

      - name: Import requested PMU date
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.date != '' }}
        timeout-minutes: 45
        run: npm run data:import:pmu -- --date "$PMU_DATE"

      - name: Import rolling PMU window
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.date == '' }}
        # Le programme des points de vente PMU (toutes nations) compte plus de
        # courses que l'ancien périmètre France seule.
        timeout-minutes: 70
        run: npm run data:import:pmu

      - name: Import press selections
        # Sélections des sites partenaires + pronostic presse PMU (voir
        # docs/partenariats-sources.md). Courses non parties uniquement. Une
        # source en panne ou qui refuse notre robot ne doit jamais faire échouer
        # le job : continue-on-error.
        continue-on-error: true
        timeout-minutes: 25
        run: node scripts/import-press.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Learn from official results
        # Les statistiques et l'apprentissage ne changent pas utilement entre
        # les deux imports quotidiens ; le passage du soir les met à jour.
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '30 17 * * *' }}
        timeout-minutes: 30
        # La sélection complète relit tout l'historique des courses : une fois
        # par semaine (dimanche) ou à la demande. Les autres soirs, rescoring
        # seul des courses à venir avec la calibration en place.
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$(date -u +%u)" = "7" ]; then
            npm run model:learn
          else
            npm run model:learn -- --rescore-only
          fi

      - name: Update jockey and trainer statistics
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '30 17 * * *' }}
        timeout-minutes: 5
        run: node scripts/update-connection-stats.mjs
