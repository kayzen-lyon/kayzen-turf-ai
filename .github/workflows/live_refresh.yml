name: Live refresh

# Cotes, parts des enjeux et pronostics gelés des courses imminentes.
#
# MODE ÉCONOMIE (depuis le 17/11/2026) : un seul passage par jour.
#
# La chaîne de boucles de 5 h 30 qui se relançaient elles-mêmes tournait
# 24 h/24 et consommait environ 43 000 minutes d'Actions par mois pour un quota
# gratuit de 2 000. Le workflow fait désormais un passage unique (--once) par
# jour, sans relance automatique.
#
# Le passage de 12:35 UTC (13:35 à Paris en hiver, 14:35 en été) rafraîchit les
# courses qui partent dans les 90 minutes, ce qui couvre en général le Quinté.
# Les autres courses gardent les cotes de l'import du programme (import_pmu.yml).
#
# Pour revenir au mode continu : restaurer la version précédente de ce fichier
# (git log -- .github/workflows/live_refresh.yml).

on:
  workflow_dispatch:
  schedule:
    - cron: "35 12 * * *"

permissions:
  contents: read

concurrency:
  group: live-refresh
  cancel-in-progress: false

jobs:
  live-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Clé privée des alertes push (src/lib/push/send.ts).
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci
        # Les secrets de la base ne sont pas exposés aux scripts d'installation
        # des quelque 500 dépendances : une seule compromise suffirait sinon à
        # exfiltrer l'accès complet à la base.
        env:
          DATABASE_URL: ""
          VAPID_PRIVATE_KEY: ""

      - name: Refresh imminent races (single pass)
        timeout-minutes: 10
        run: npx tsx scripts/live-refresh.ts --once
